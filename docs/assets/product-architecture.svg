<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="t d">
<title id="t">SatyTracker78 animated product architecture</title><desc id="d">Three separate lanes explain the Chrome recorder and replay loop, optional Windows native companion setup and permission, and the dashboard workflow management path that currently queues but does not execute.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182b4c"/></linearGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#83a8d8"/></marker>
</defs>
<rect width="1440" height="620" rx="30" fill="url(#bg)"/>
<text x="58" y="64" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="700">ONE PRODUCT · THREE DISTINCT EXECUTION BOUNDARIES</text>
<text x="58" y="96" fill="#9fb4d3" font-family="Arial,sans-serif" font-size="17">Follow the moving signal through each path — browser replay, optional desktop permission, and dashboard management.</text>
<g font-family="Arial,sans-serif">
 <rect x="48" y="128" width="1344" height="190" rx="20" fill="#102541" stroke="#28647a"/>
 <text x="76" y="164" fill="#5eead4" font-size="16" font-weight="700">A · CHROME EXTENSION — RECORD AND REPEAT</text>
 <g fill="#102e4d" stroke="#5eead4" stroke-width="2">
  <rect x="76" y="190" width="220" height="78" rx="12"/><rect x="390" y="190" width="220" height="78" rx="12"/><rect x="704" y="190" width="220" height="78" rx="12"/><rect x="1018" y="190" width="300" height="78" rx="12"/>
 </g>
 <g fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">
  <text x="186" y="222">User action</text><text x="186" y="246" fill="#a9c5df" font-size="13" font-weight="400">Clicks · inputs · scroll</text>
  <text x="500" y="222">Recorder</text><text x="500" y="246" fill="#a9c5df" font-size="13" font-weight="400">DOM + target context</text>
  <text x="814" y="222">Replay engine</text><text x="814" y="246" fill="#a9c5df" font-size="13" font-weight="400">Resolve · animate · act</text>
  <text x="1168" y="222">Website</text><text x="1168" y="246" fill="#a9c5df" font-size="13" font-weight="400">Synthetic page events</text>
 </g>
 <g stroke="#83a8d8" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M296 229 H382"/><path d="M610 229 H696"/><path d="M924 229 H1010"/></g>
 <path d="M1168 278 V293 H814 V278" stroke="#83a8d8" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
 <text x="990" y="307" fill="#a9c5df" font-size="12" text-anchor="middle">Repeat until user stops</text>
 <circle r="8" fill="#5eead4" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M296 229 H382 M610 229 H696 M924 229 H1010 M1168 278 V293 H814 V278"/></circle>

 <rect x="48" y="338" width="1344" height="122" rx="20" fill="#171e3e" stroke="#7662b7"/>
 <text x="76" y="374" fill="#c4b5fd" font-size="16" font-weight="700">B · OPTIONAL WINDOWS DESKTOP HELPER — LOCAL PERMISSION PATH</text>
 <g fill="#242b53" stroke="#a78bfa" stroke-width="2"><rect x="76" y="391" width="250" height="48" rx="10"/><rect x="430" y="391" width="250" height="48" rx="10"/><rect x="784" y="391" width="250" height="48" rx="10"/><rect x="1138" y="391" width="180" height="48" rx="10"/></g>
 <g fill="#f8fafc" text-anchor="middle" font-size="15" font-weight="700"><text x="201" y="421">Install + register host</text><text x="555" y="421">Chrome Native Messaging</text><text x="909" y="421">Windows approval dialog</text><text x="1228" y="421">5-minute access</text></g>
 <g stroke="#9d91df" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M326 415 H422"/><path d="M680 415 H776"/><path d="M1034 415 H1130"/></g>
 <circle r="6" fill="#c4b5fd" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M326 415 H422 M680 415 H776 M1034 415 H1130"/></circle>
 <text x="76" y="451" fill="#b9b7d6" font-size="12">Permission expires automatically; Stop or Chrome disconnect revokes it. This is not proof that browser replay is routed through hardware input.</text>

 <rect x="48" y="480" width="1344" height="104" rx="20" fill="#172a3a" stroke="#b58b48"/>
 <text x="76" y="516" fill="#fcd34d" font-size="16" font-weight="700">C · WORKFLOW DASHBOARD — MANAGEMENT PATH (NOT AN EXECUTION ENGINE YET)</text>
 <g fill="#293747" stroke="#eabf63" stroke-width="2"><rect x="76" y="532" width="260" height="38" rx="9"/><rect x="430" y="532" width="260" height="38" rx="9"/><rect x="784" y="532" width="250" height="38" rx="9"/><rect x="1128" y="532" width="190" height="38" rx="9"/></g>
 <g fill="#fff" text-anchor="middle" font-size="14" font-weight="700"><text x="206" y="556">Create / edit workflow</text><text x="560" y="556">Validate + localStorage</text><text x="909" y="556">Queue attempt</text><text x="1223" y="556">Blocked safely</text></g>
 <g stroke="#d6b56d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M336 551 H422"/><path d="M690 551 H776"/><path d="M1034 551 H1120"/></g>
 <circle r="5" fill="#fcd34d" filter="url(#glow)"><animateMotion dur="4.2s" repeatCount="indefinite" path="M336 551 H422 M690 551 H776 M1034 551 H1120"/></circle>
</g></svg>