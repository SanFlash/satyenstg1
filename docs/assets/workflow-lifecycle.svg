<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">SatyTracker78 workflow recording and replay animation</title>
<desc id="desc">An animated sequence showing a user recording browser actions, reviewing a workflow, replaying it in a loop, and stopping the run.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#17264a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<text x="56" y="58" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">FROM REPEATABLE TASK TO CONTROLLED WORKFLOW</text>
<text x="56" y="88" fill="#a9bad8" font-family="Inter,Arial,sans-serif" font-size="15">A visual overview of the browser extension lifecycle</text>
<path d="M160 215 H1040" stroke="#33496e" stroke-width="5" stroke-linecap="round"/>
<path d="M160 215 H1040" stroke="url(#accent)" stroke-width="3" stroke-dasharray="18 18" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.2s" repeatCount="indefinite"/>
</path>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
  <g transform="translate(160 215)">
    <circle r="58" fill="#142746" stroke="#5eead4" stroke-width="2"/>
    <circle r="43" fill="#1b365c"/>
    <circle r="12" fill="#fb7185"><animate attributeName="r" values="10;15;10" dur="1.3s" repeatCount="indefinite"/></circle>
    <text y="94" fill="#f8fafc" font-size="18" font-weight="700">1. RECORD</text>
    <text y="118" fill="#a9bad8" font-size="13">Capture DOM actions</text>
  </g>
  <g transform="translate(453 215)">
    <circle r="58" fill="#142746" stroke="#60a5fa" stroke-width="2"/>
    <rect x="-28" y="-25" width="56" height="50" rx="7" fill="#24466e" stroke="#93c5fd"/>
    <path d="M-17 -10 H17 M-17 0 H11 M-17 10 H4" stroke="#dbeafe" stroke-width="4" stroke-linecap="round"/>
    <text y="94" fill="#f8fafc" font-size="18" font-weight="700">2. REVIEW</text>
    <text y="118" fill="#a9bad8" font-size="13">Check steps &amp; timing</text>
  </g>
  <g transform="translate(747 215)">
    <circle r="58" fill="#142746" stroke="#a78bfa" stroke-width="2"/>
    <path d="M-18 -25 L25 0 L-18 25 Z" fill="#c4b5fd"/>
    <path d="M-35 -37 A52 52 0 1 1 -42 22" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </path>
    <text y="94" fill="#f8fafc" font-size="18" font-weight="700">3. REPLAY</text>
    <text y="118" fill="#a9bad8" font-size="13">Repeat until stopped</text>
  </g>
  <g transform="translate(1040 215)">
    <circle r="58" fill="#142746" stroke="#fbbf24" stroke-width="2"/>
    <rect x="-19" y="-19" width="38" height="38" rx="5" fill="#fbbf24"/>
    <text y="94" fill="#f8fafc" font-size="18" font-weight="700">4. STOP</text>
    <text y="118" fill="#a9bad8" font-size="13">User remains in control</text>
  </g>
</g>
<circle r="8" fill="#5eead4" filter="url(#glow)">
  <animateMotion dur="5.5s" repeatCount="indefinite" path="M160 215 H1040"/>
</circle>
<rect x="56" y="370" width="1088" height="1" fill="#34496b"/>
<text x="56" y="399" fill="#9fb2d2" font-family="Inter,Arial,sans-serif" font-size="13">Optional Windows companion • explicit local approval • five-minute permission window</text>
<text x="1144" y="399" fill="#9fb2d2" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="end">SATYTRACKER78</text>
</svg>