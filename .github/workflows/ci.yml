name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Test extension message contract
        run: node --test extension/*.test.js
      - name: Test legacy native helper safety contract
        run: python -m unittest discover -s extension/native-host -p test_host.py
      - name: Test legacy native messaging host stdio protocol
        run: python extension/native-host/verify-host.py extension/native-host/host.py
      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/recorder.js
          node --check extension/popup.js
      - name: Validate extension manifest
        run: node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3 || !m.background?.service_worker || !m.action?.default_popup) process.exit(1)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  windows-desktop-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows agent
        run: dotnet publish desktop-agent/SatyTracker78.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o desktop-agent/publish
      - name: Smoke-test compiled Native Messaging agent
        run: python desktop-agent/test_protocol.py desktop-agent/publish/SatyTracker78.Agent.exe
      - name: Assemble source-based installer package (no executable)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop-agent/distribution | Out-Null
          Copy-Item desktop-agent/SatyTracker78.Agent.csproj desktop-agent/distribution/
          Copy-Item desktop-agent/Program.cs desktop-agent/distribution/
          Copy-Item desktop-agent/build-and-install.bat desktop-agent/distribution/
          Copy-Item desktop-agent/setup-dotnet-sdk.ps1 desktop-agent/distribution/
          Copy-Item desktop-agent/install-agent.bat desktop-agent/distribution/
          Copy-Item desktop-agent/uninstall-agent.bat desktop-agent/distribution/
          Copy-Item desktop-agent/README.md desktop-agent/distribution/
      - name: Upload source-based Windows package
        uses: actions/upload-artifact@v4
        with:
          name: satytracker78-windows-agent-source
          path: desktop-agent/distribution/
          if-no-files-found: error
          retention-days: 30
