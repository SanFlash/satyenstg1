name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Test extension message contract
        run: node --test extension/*.test.js
      - name: Test legacy native helper safety contract
        run: python -m unittest discover -s extension/native-host -p test_host.py
      - name: Test legacy native messaging host stdio protocol
        run: python extension/native-host/verify-host.py extension/native-host/host.py
      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/recorder.js
          node --check extension/popup.js
      - name: Validate extension manifest
        run: node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3 || !m.background?.service_worker || !m.action?.default_popup) process.exit(1)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  windows-desktop-agent:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows agent
        run: dotnet publish desktop-agent/SatyTracker78.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o desktop-agent/publish
      - name: Smoke-test compiled Native Messaging agent
        run: python desktop-agent/test_protocol.py desktop-agent/publish/SatyTracker78.Agent.exe
      - name: Assemble end-user Windows setup package
        shell: pwsh
        run: |
          $dist = 'desktop-agent/distribution'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item desktop-agent/publish/SatyTracker78.Agent.exe $dist/
          Copy-Item desktop-agent/Setup-SatyTracker78.cmd $dist/
          Copy-Item desktop-agent/Install-SatyTracker78.ps1 $dist/
          Copy-Item desktop-agent/Uninstall-SatyTracker78.cmd $dist/
          Copy-Item desktop-agent/Uninstall-SatyTracker78.ps1 $dist/
          Copy-Item desktop-agent/README.md $dist/
          Compress-Archive -Path "$dist/*" -DestinationPath desktop-agent/SatyTracker78-Windows-Setup.zip -Force
      - name: Upload end-user Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: SatyTracker78-Windows-Setup
          path: desktop-agent/SatyTracker78-Windows-Setup.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish or update the latest end-user download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-helper-latest
          name: SatyTracker78 Desktop Helper (Latest)
          files: desktop-agent/SatyTracker78-Windows-Setup.zip
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
